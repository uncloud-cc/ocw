name: Service with health check
sequence:
  - name: Database
    id: db
    image: postgres:15
    background: true
    healthCheck:
      cmd: pg_isready
      interval: 2s
      timeout: 3s
      retries: 5

  - name: Cache
    id: cache
    image: redis:7-alpine
    background: true

  - name: Run Migrations
    image: myapp:latest
    needs: [db, cache]
    cmd: echo "Running migrations..."

  - name: Run Application
    image: myapp:latest
    needs: [db]
    cmd: echo "Starting application..."
