{{ define "main" }}
<article class="home">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    
    <section class="recent-posts">
        <h2>Recent Posts</h2>
        {{ range (where .Site.RegularPages "Type" "posts" | first 5) }}
        <article class="post-preview">
            <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
            <time datetime="{{ .Date.Format "2006-01-02" }}">
                {{ .Date.Format "January 2, 2006" }}
            </time>
            <p>{{ .Summary }}</p>
        </article>
        {{ end }}
    </section>
</article>
{{ end }}
