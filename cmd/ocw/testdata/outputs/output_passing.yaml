name: Output Passing Test

outputs:
  final_version: "{{ steps.version.version }}"

sequence:
  - name: Generate Version
    id: version
    image: alpine:latest
    cmd: |
      echo "version=2.0.0" >> $OUTPUTS
      echo "Generated version"

  - name: Display Version
    image: alpine:latest
    cmd: echo "The version is {{ steps.version.version }}"
