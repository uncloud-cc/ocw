name: Switch Test

switch: "{{ env.ENVIRONMENT }}"
case:
  staging:
    - name: Deploy to Staging
      image: alpine:latest
      cmd: echo "Deploying to staging"

  production:
    - name: Deploy to Production
      image: alpine:latest
      cmd: echo "Deploying to production"

default:
  - name: Deploy to Development
    image: alpine:latest
    cmd: echo "Deploying to development"
