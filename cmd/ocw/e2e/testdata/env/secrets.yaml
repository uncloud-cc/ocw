name: Secrets Test

env:
  DB_USER: testuser
  DB_PASSWORD:
    secret: true
    default: secretpass123
  API_KEY:
    secret: true
    default: api-key-456

sequence:
  - name: Show Values
    image: alpine:latest
    cmd: |
      echo "User: {{ env.DB_USER }}"
      echo "Password: {{ env.DB_PASSWORD }}"
      echo "API Key: {{ env.API_KEY }}"
