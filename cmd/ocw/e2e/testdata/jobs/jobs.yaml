name: Multi-Job Workflow

jobs:
  build:
    name: Build Job
    sequence:
      - name: Build Step
        image: alpine:latest
        cmd: echo "Building..."

  test:
    name: Test Job
    sequence:
      - name: Test Step
        image: alpine:latest
        cmd: echo "Testing..."

  deploy:
    name: Deploy Job
    sequence:
      - name: Deploy Step
        image: alpine:latest
        cmd: echo "Deploying..."
