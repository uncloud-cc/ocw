name: Nested Workflow
sequence:
  - name: Setup
    image: alpine:latest
    cmd: echo "Setting up"

  - name: Run Tests in Parallel
    parallel:
      - name: Unit Tests
        image: alpine:latest
        cmd: echo "Running unit tests"

      - name: Integration Tests
        image: alpine:latest
        cmd: echo "Running integration tests"

  - name: Finish
    image: alpine:latest
    cmd: echo "All tests completed"
