baseURL = 'https://uncloud-cc.github.io/ocw/'
languageCode = 'en-us'
title = 'ocw'
copyright = "© 2026 OCW Project. MIT License."

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    name = 'Docs'
    pageRef = '/docs'
    weight = 1
  [[menu.main]]
    name = 'Reference'
    pageRef = '/reference'
    weight = 1
  [[menu.main]]
    name = 'GitHub'
    url = 'https://github.com/uncloud-cc/ocw'
    weight = 2
  [[menu.main]]
    name = 'Search'
    weight = 3
    [menu.main.params]
      type = 'search'

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.footer]
    displayCopyright = false
    displayPoweredBy = true
  [params.editURL]
    enable = true
    base = 'https://github.com/uncloud-cc/ocw/edit/main/docs/content'
